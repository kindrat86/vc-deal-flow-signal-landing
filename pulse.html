<script>
// === Startup Pulse — Live Particle Visualization ===
const API = 'https://signals.gitdealflow.com/api/signals.json';
const COLORS = {
  'hiring-burst': '#22c55e',
  'accelerant': '#60a5fa',
  'breakout': '#a855f7',
  'steady': '#64748b',
  'Framework migration': '#f59e0b',
  'default': '#475569',
};
const COLOR_NAMES = {
  '#22c55e': 'Accelerating',
  '#60a5fa': 'Steady',
  '#a855f7': 'Breakout',
  '#64748b': 'Tracked',
  '#f59e0b': 'Decelerating',
  '#475569': 'Tracked',
};

// Particles
let particles = [];
let mouse = { x: 0, y: 0 };
let canvas, ctx;

function getColor(signalType) {
  return COLORS[signalType] || COLORS['default'];
}

class Particle {
  constructor(startup, idx, total) {
    this.startup = startup;
    this.name = startup.name || 'Unknown';
    this.velocity = parseInt(startup.commitVelocity14d) || 0;
    this.contributors = parseInt(startup.contributors) || 0;
    this.signalType = startup.signalType || 'tracked';
    this.velChange = parseFloat(String(startup.commitVelocityChange || '0').replace(/%/g, '')) || 0;
    
    // Position — random but avoid clustering
    const angle = (2 * Math.PI * idx) / total + Math.random() * 0.3;
    const radius = Math.random() * Math.min(canvas.width, canvas.height) * 0.35;
    this.x = canvas.width / 2 + Math.cos(angle) * radius;
    this.y = canvas.height / 2 + Math.sin(angle) * radius;
    
    // Movement
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.baseSpeed = Math.min(1, Math.max(0.1, this.velocity / 200));
    this.orbitAngle = angle;
    this.orbitRadius = radius;
    this.orbitSpeed = 0.0003 + (1 - this.velocity / 500) * 0.001;
    
    // Size
    this.size = Math.max(3, Math.min(12, 3 + (this.velocity / 500) * 9));
    this.glowSize = this.size * 3;
    
    // Color
    this.color = getColor(this.signalType);
    
    // Pulse
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.02 + Math.random() * 0.03;
  }

  update() {
    // Orbit motion — slow circular drift
    this.orbitAngle += this.orbitSpeed;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    this.x = cx + Math.cos(this.orbitAngle) * this.orbitRadius;
    this.y = cy + Math.sin(this.orbitAngle) * this.orbitRadius;
    
    // Add subtle random jitter
    this.x += (Math.random() - 0.5) * 0.5;
    this.y += (Math.random() - 0.5) * 0.5;
    
    // Pulse phase
    this.pulsePhase += this.pulseSpeed;
    
    // Mouse repulsion
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 100 && dist > 0) {
      const force = (100 - dist) / 100 * 2;
      this.x += (dx / dist) * force;
      this.y += (dy / dist) * force;
    }
  }

  draw(ctx) {
    const pulse = Math.sin(this.pulsePhase) * 0.2 + 0.8;
    const r = this.size * pulse;
    const gr = this.glowSize * pulse;
    
    // Glow
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, gr);
    grad.addColorStop(0, this.color + '44');
    grad.addColorStop(1, this.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, gr, 0, Math.PI * 2);
    ctx.fill();
    
    // Core dot
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
    
    // Label for larger particles
    if (this.size > 6) {
      ctx.fillStyle = '#94a3b844';
      ctx.font = '8px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(this.name.length > 12 ? this.name.slice(0, 11) + '…' : this.name, this.x, this.y + r + 10);
    }
  }

  contains(px, py) {
    const dx = this.x - px;
    const dy = this.y - py;
    return Math.sqrt(dx * dx + dy * dy) < 20;
  }
}

async function loadData() {
  try {
    const resp = await fetch(API);
    const json = await resp.json();
    const allStartups = [];
    
    // Flatten all startups from sectors + trending
    const seen = new Set();
    (json.trending || []).forEach(s => {
      if (s.name) { allStartups.push(s); seen.add(s.name.toLowerCase()); }
    });
    (json.sectors || []).forEach(sec => {
      (sec.startups || []).forEach(s => {
        if (s.name && !seen.has(s.name.toLowerCase())) {
          allStartups.push(s);
          seen.add(s.name.toLowerCase());
        }
      });
    });
    
    return allStartups;
  } catch (e) {
    console.error('Failed to load data', e);
    return [];
  }
}

function init() {
  canvas = document.getElementById('pulse-canvas');
  ctx = canvas.getContext('2d');
  resize();
  
  document.getElementById('loading').style.display = 'none';
  
  loadData().then(startups => {
    document.getElementById('startup-count').textContent = startups.length;
    particles = startups.map((s, i) => new Particle(s, i, startups.length));
    animate();
  });
  
  // Events
  window.addEventListener('resize', resize);
  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  canvas.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw subtle grid
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 0.5;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  for (let r = 100; r < Math.max(canvas.width, canvas.height) * 0.5; r += 100) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Check hover for tooltip
  let hovered = null;
  for (const p of particles) {
    if (p.contains(mouse.x, mouse.y)) {
      hovered = p;
      break;
    }
  }
  
  // Update and draw
  for (const p of particles) {
    p.update();
    p.draw(ctx);
  }
  
  // Tooltip
  const tooltip = document.getElementById('tooltip');
  if (hovered) {
    const s = hovered.startup;
    const arrow = hovered.velChange >= 0 ? '▲' : '▼';
    const chColor = hovered.velChange >= 0 ? '#22c55e' : '#ef4444';
    tooltip.innerHTML = `
      <div class="name">${hovered.name}</div>
      <div class="stat"><span class="k">Velocity</span><span class="v">${hovered.velocity}</span></div>
      <div class="stat"><span class="k">Change</span><span class="v" style="color:${chColor}">${arrow} ${Math.abs(hovered.velChange)}%</span></div>
      <div class="stat"><span class="k">Contributors</span><span class="v">${hovered.contributors}</span></div>
      <div class="sig" style="background:${hovered.color}22;color:${hovered.color};border:1px solid ${hovered.color}44">${hovered.signalType}</div>
    `;
    tooltip.style.left = Math.min(mouse.x + 20, window.innerWidth - 220) + 'px';
    tooltip.style.top = Math.min(mouse.y + 20, window.innerHeight - 180) + 'px';
    tooltip.classList.add('visible');
  } else {
    tooltip.classList.remove('visible');
  }
  
  requestAnimationFrame(animate);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
