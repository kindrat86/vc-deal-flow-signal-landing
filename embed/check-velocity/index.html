<h2>🚀 Startup Velocity Checker</h2>
<div class="search-row">
<input id="wInput" placeholder="e.g. Hugging Face..." type="text"/>
<button id="wBtn" onclick="wSearch()">Check</button>
</div>
<div class="loader" id="wLoader"><div class="spinner"></div></div>
<div class="result" id="wResult">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
<strong id="wName" style="font-size:0.9rem">—</strong>
<span id="wScore" style="font-size:1.25rem;font-weight:700;color:#60a5fa">—</span>
</div>
<div class="mini-metrics">
<div class="mini-metric"><div class="label">Commit Δ</div><div class="value" id="wCommit">—</div></div>
<div class="mini-metric"><div class="label">Contributors</div><div class="value" id="wContrib">—</div></div>
<div class="mini-metric"><div class="label">Stage</div><div class="value" id="wStage" style="font-size:0.8rem">—</div></div>
</div>
<div class="powered">Powered by <a href="https://gitdealflow.com/check-velocity" rel="noopener" target="_blank">GitDealFlow</a></div>
</div>
</div>
<script>
async function wSearch() {
  const q = document.getElementById('wInput').value.trim();
  if (!q) return;
  document.getElementById('wLoader').classList.add('visible');
  document.getElementById('wResult').classList.remove('visible');
  document.getElementById('wBtn').disabled = true;
  try {
    let r = await fetch('https://signals.gitdealflow.com/api/signals.json');
    let d = await r.json();
    let found = null;
    if (d && d.sectors) {
      for (const s of d.sectors) {
        if (s.startups) for (const st of s.startups) {
          if (st.name && st.name.toLowerCase().includes(q.toLowerCase())) { found = st; break; }
        }
        if (found) break;
      }
    }
    if (found) {
      document.getElementById('wName').textContent = found.name;
      const cd = found.commitVelocityChange || found.commit_velocity_change || 0;
      const cg = found.contributorGrowth || found.contributor_growth || 0;
      const score = Math.min(25 + Math.min(Math.abs(cd)*30,30) + Math.min(Math.abs(cg)*25,25), 100);
      document.getElementById('wScore').textContent = `${Math.round(score)}/100`;
      const cp = (cd*100).toFixed(0);
      document.getElementById('wCommit').innerHTML = `${cp > 0 ? '+' : ''}${cp}% <span class="${cp>=0?'up':'down'}">${cp>=0?'▲':'▼'}</span>`;
      const cgp = (cg*100).toFixed(0);
      document.getElementById('wContrib').innerHTML = `${cgp > 0 ? '+' : ''}${cgp}% <span class="${cgp>=0?'up':'down'}">${cgp>=0?'▲':'▼'}</span>`;
      document.getElementById('wStage').textContent = (found.stage || found.stage_name || 'Startup').replace(/-/g,' ');
    } else {
      document.getElementById('wName').textContent = `"${q}" not found`;
      document.getElementById('wScore').textContent = '?';
      document.getElementById('wCommit').textContent = '—'; 
      document.getElementById('wContrib').textContent = '—';
      document.getElementById('wStage').textContent = 'Try a different name';
    }
    document.getElementById('wResult').classList.add('visible');
  } catch(e) {
    document.getElementById('wName').textContent = 'API unavailable';
    document.getElementById('wScore').textContent = '—';
    document.getElementById('wResult').classList.add('visible');
  }
  document.getElementById('wLoader').classList.remove('visible');
  document.getElementById('wBtn').disabled = false;
}
document.getElementById('wInput').addEventListener('keydown', e => { if (e.key === 'Enter') wSearch(); });
</script>
