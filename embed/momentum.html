<script>
  (function() {
    var API = 'https://signals.gitdealflow.com/api/signals.json';
    var items = document.getElementById('items');

    fetch(API)
      .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function(data) {
        var trending = (data.trending || []).slice(0, 5);
        if (!trending.length) {
          items.innerHTML = '<div class="error">No data available</div>';
          return;
        }
        items.innerHTML = trending.map(function(s) {
          var change = s.commitVelocityChange || '+0%';
          var isPositive = !change.startsWith('-');
          var changeColor = isPositive ? '#4ade80' : '#f87171';
          return '<div class="item">' +
            '<div><div class="name">' + esc(s.name) + '</div><div class="meta">' + esc(s.signalType || 'Active') + ' · ' + esc(s.geography || 'Global') + '</div></div>' +
            '<div style="text-align:right;"><div class="change" style="color:' + changeColor + '">' + change + '</div><div class="commits">' + (s.commitVelocity14d || 0) + ' commits/14d</div></div>' +
            '</div>';
        }).join('');
      })
      .catch(function() {
        items.innerHTML = '<div class="error">Could not load. <a href="https://signals.gitdealflow.com/trending" target="_blank">View on signals →</a></div>';
      });

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = String(s == null ? '' : s);
      return d.innerHTML;
    }
  })();
  </script>
